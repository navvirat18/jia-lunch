<script>

function go(a,b){
  document.getElementById(a).classList.add('hidden');
  document.getElementById(b).classList.remove('hidden');
}

function acceptTerms(){
  if(!document.getElementById('agree').checked){
    alert("You must agree. The lunch lawyers insist. 😂");
    return;
  }

  go('page2','page3');
}

function confirmLunch() {

  const time = document.getElementById("lunchTime").value;

  if (!time) {
    alert("Please choose a lunch time first! 🍽️😂");
    return;
  }

  /*
   * SHOW PAGE 4 IMMEDIATELY
   * This means the invitation will work even if
   * Formspree takes a moment to process the email.
   */

  document.getElementById("chosen").textContent = time;

  document.getElementById("page3").classList.add("hidden");

  document.getElementById("page4").classList.remove("hidden");

  celebrate();


  /*
   * SEND THE RESPONSE TO FORMSPREE
   */

  const form = document.createElement("form");

  form.action = "https://formspree.io/f/mgavklgd";

  form.method = "POST";

  form.target = "formspreeFrame";

  form.style.display = "none";


  function addField(name, value) {

    const input = document.createElement("input");

    input.type = "hidden";

    input.name = name;

    input.value = value;

    form.appendChild(input);
  }


  addField(
    "name",
    "Jia Alliezeh Khan"
  );

  addField(
    "day",
    "Monday"
  );

  addField(
    "location",
    "Cyberjaya"
  );

  addField(
    "lunch_time",
    time
  );

  addField(
    "_subject",
    "🍽️ JIA HAS CHOSEN HER MONDAY LUNCH TIME!"
  );

  addField(
    "message",
    "🚨 LUNCH CONFIRMATION 🚨\n\n" +
    "Jia Alliezeh Khan has chosen her lunch time.\n\n" +
    "📅 Monday\n" +
    "⏰ " + time + "\n" +
    "📍 Cyberjaya\n\n" +
    "🎉 The lunch mission has officially been scheduled."
  );


  /*
   * Hidden iframe prevents the page from
   * navigating away from your invitation.
   */

  let iframe = document.getElementById("formspreeFrame");

  if (!iframe) {

    iframe = document.createElement("iframe");

    iframe.id = "formspreeFrame";

    iframe.name = "formspreeFrame";

    iframe.style.display = "none";

    document.body.appendChild(iframe);
  }


  document.body.appendChild(form);

  form.submit();


  /*
   * Update the final message
   */

  const finalMessage =
    document.getElementById("finalMessage");

  if (finalMessage) {

    finalMessage.textContent =
      "✅ Lunch confirmed! The Ministry of Lunch has been notified. 📧😂";
  }
}
function celebrate(){

  const box = document.getElementById('confetti');

  for(let i=0;i<90;i++){

    const x = document.createElement('i');

    x.style.left = Math.random()*100+'vw';

    x.style.animationDelay =
      Math.random()*2+'s';

    x.style.transform =
      'rotate('+Math.random()*360+'deg)';

    x.style.background =
      ['#ff4f81','#ffd43b','#20a464','#6c63ff']
      [Math.floor(Math.random()*4)];

    box.appendChild(x);
  }

  document.getElementById('finalMessage').textContent =
    "Lunch has been scheduled. Escape attempt unsuccessful. 😭🍽️";
}


/* ============================
   EXAM COUNTDOWN
   ============================ */

function countdown(){

  const now = new Date();

  const target = new Date(now);

  const day = now.getDay();

  let add = (8-day)%7;

  if(add === 0 && now.getHours() >= 11){
    add = 7;
  }

  target.setDate(
    now.getDate()+add
  );

  target.setHours(11,30,0,0);

  let diff = Math.max(0,target-now);

  const d = Math.floor(diff/86400000);
  diff %= 86400000;

  const h = Math.floor(diff/3600000);
  diff %= 3600000;

  const m = Math.floor(diff/60000);
  diff %= 60000;

  const s = Math.floor(diff/1000);

  document.getElementById('days').textContent = d;
  document.getElementById('hours').textContent = h;
  document.getElementById('mins').textContent = m;
  document.getElementById('secs').textContent = s;
}

countdown();

setInterval(countdown,1000);


/* ============================
   RUNAWAY NO BUTTON 😂
   ============================ */

const no = document.createElement('button');

no.textContent = 'NO 😭';

no.className = 'no';

no.style.left = '50%';

no.style.top = '78%';

document.body.appendChild(no);


function escapeNo(){

  no.style.left =
    Math.max(5,Math.random()*85)+'vw';

  no.style.top =
    Math.max(5,Math.random()*85)+'vh';

  no.textContent =
    ['NO 😭',
     'TOO SLOW 😂',
     'NICE TRY',
     'NOPE',
     'ACCESS DENIED 🚫'
    ][Math.floor(Math.random()*5)];
}


no.addEventListener(
  'mouseenter',
  escapeNo
);

no.addEventListener(
  'touchstart',
  e=>{
    e.preventDefault();
    escapeNo();
  }
);

no.addEventListener(
  'click',
  escapeNo
);

</script>
