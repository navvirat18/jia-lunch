<script>

function go(a,b){
  document.getElementById(a).classList.add('hidden');
  document.getElementById(b).classList.remove('hidden');
}

function acceptTerms(){
  if(!document.getElementById('agree').checked){
    alert("You must agree. The lunch lawyers insist. 😂");
    return;
  }

  go('page2','page3');
}

async function confirmLunch(){

  const time = document.getElementById("lunchTime").value;

  // Make sure a time was selected
  if(!time){
    alert("Please choose a lunch time first! 🍽️😂");
    return;
  }

  // Find the Confirm Lunch button
  const button = document.querySelector("#page3 .yes");

  // Prevent double clicking
  button.disabled = true;
  button.textContent = "SENDING... 📡";

  // Create the Formspree submission
  const formData = new FormData();

  formData.append("name", "Jia Alliezeh Khan");
  formData.append("day", "Monday");
  formData.append("location", "Cyberjaya");
  formData.append("lunch_time", time);

  formData.append(
    "_subject",
    "🍽️ JIA HAS CHOSEN HER MONDAY LUNCH TIME!"
  );

  formData.append(
    "message",
    "🚨 LUNCH CONFIRMATION 🚨\n\n" +
    "Jia Alliezeh Khan has chosen her lunch time!\n\n" +
    "📅 Day: Monday\n" +
    "⏰ Time: " + time + "\n" +
    "📍 Location: Cyberjaya\n\n" +
    "🎉 The lunch mission has officially been scheduled.\n\n" +
    "— Ministry of Lunch 😂"
  );

  try{

    const response = await fetch(
      "https://formspree.io/f/mgavklgd",
      {
        method: "POST",
        body: formData,
        headers: {
          "Accept": "application/json"
        }
      }
    );

    if(response.ok){

      // Show the selected time
      document.getElementById("chosen").textContent = time;

      // Move from Page 3 to Page 4
      document.getElementById("page3").classList.add("hidden");
      document.getElementById("page4").classList.remove("hidden");

      // CONFETTI 🎉
      celebrate();

    }else{

      const errorData = await response.json().catch(() => null);

      console.error("Formspree error:", errorData);

      alert(
        "The Lunch Ministry rejected the submission. 😭\n\n" +
        "Please try again."
      );

      button.disabled = false;
      button.textContent = "CONFIRM LUNCH 🍽️";
    }

  }catch(error){

    console.error("Network error:", error);

    alert(
      "The lunch authorities could not be reached. 😂\n\n" +
      "Please check your internet connection and try again."
    );

    button.disabled = false;
    button.textContent = "CONFIRM LUNCH 🍽️";
  }
}

function celebrate(){

  const box = document.getElementById('confetti');

  for(let i=0;i<90;i++){

    const x = document.createElement('i');

    x.style.left = Math.random()*100+'vw';

    x.style.animationDelay =
      Math.random()*2+'s';

    x.style.transform =
      'rotate('+Math.random()*360+'deg)';

    x.style.background =
      ['#ff4f81','#ffd43b','#20a464','#6c63ff']
      [Math.floor(Math.random()*4)];

    box.appendChild(x);
  }

  document.getElementById('finalMessage').textContent =
    "Lunch has been scheduled. Escape attempt unsuccessful. 😭🍽️";
}


/* ============================
   EXAM COUNTDOWN
   ============================ */

function countdown(){

  const now = new Date();

  const target = new Date(now);

  const day = now.getDay();

  let add = (8-day)%7;

  if(add === 0 && now.getHours() >= 11){
    add = 7;
  }

  target.setDate(
    now.getDate()+add
  );

  target.setHours(11,30,0,0);

  let diff = Math.max(0,target-now);

  const d = Math.floor(diff/86400000);
  diff %= 86400000;

  const h = Math.floor(diff/3600000);
  diff %= 3600000;

  const m = Math.floor(diff/60000);
  diff %= 60000;

  const s = Math.floor(diff/1000);

  document.getElementById('days').textContent = d;
  document.getElementById('hours').textContent = h;
  document.getElementById('mins').textContent = m;
  document.getElementById('secs').textContent = s;
}

countdown();

setInterval(countdown,1000);


/* ============================
   RUNAWAY NO BUTTON 😂
   ============================ */

const no = document.createElement('button');

no.textContent = 'NO 😭';

no.className = 'no';

no.style.left = '50%';

no.style.top = '78%';

document.body.appendChild(no);


function escapeNo(){

  no.style.left =
    Math.max(5,Math.random()*85)+'vw';

  no.style.top =
    Math.max(5,Math.random()*85)+'vh';

  no.textContent =
    ['NO 😭',
     'TOO SLOW 😂',
     'NICE TRY',
     'NOPE',
     'ACCESS DENIED 🚫'
    ][Math.floor(Math.random()*5)];
}


no.addEventListener(
  'mouseenter',
  escapeNo
);

no.addEventListener(
  'touchstart',
  e=>{
    e.preventDefault();
    escapeNo();
  }
);

no.addEventListener(
  'click',
  escapeNo
);

</script>
